name: release
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Zig
        uses: mlugg/setup-zig@v2
      - name: Cache Zig
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            zig-out
          key: ${{ runner.os }}-zig-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**/*.zig') }}
      - name: Install N-API headers
        run: npm ci
      - name: Zig tests
        run: zig build test --summary all
      - name: Build shared library
        run: zig build -Doptimize=ReleaseSmall -Dnapi-include=node_modules/node-api-headers/include
      - name: Prepare prebuilds
        shell: bash
        run: |
          ARCH=${{ runner.arch == 'X64' && 'x86_64' || 'aarch64' }}
          PLATFORM=${{ runner.os == 'Linux' && 'linux-gnu' || runner.os == 'macOS' && 'macos' || 'windows' }}
          mkdir -p dist/bin/${ARCH}-${PLATFORM}
          if [ -f zig-out/lib/libzig_id.so ]; then cp zig-out/lib/libzig_id.so dist/bin/${ARCH}-${PLATFORM}/zig-id.node; fi
          if [ -f zig-out/lib/libzig_id.dylib ]; then cp zig-out/lib/libzig_id.dylib dist/bin/${ARCH}-${PLATFORM}/zig-id.node; fi
          if [ -f zig-out/bin/zig_id.dll ]; then cp zig-out/bin/zig_id.dll dist/bin/${ARCH}-${PLATFORM}/zig-id.node; fi
          ls -la dist/bin/${ARCH}-${PLATFORM}/
      - name: Upload prebuild
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ runner.arch == 'X64' && 'x86_64' || 'aarch64' }}-${{ runner.os == 'Linux' && 'linux-gnu' || runner.os == 'macOS' && 'macos' || 'windows' }}
          path: dist/bin/
          if-no-files-found: error

  build-cross:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-gnu
            platform: aarch64-linux-gnu
          - target: x86_64-macos
            platform: x86_64-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
      - name: Install N-API headers
        run: npm ci
      - name: Build for ${{ matrix.target }}
        run: |
          zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSmall -Dnapi-include=node_modules/node-api-headers/include
          mkdir -p dist/bin/${{ matrix.platform }}
          if [ -f zig-out/lib/libzig_id.so ]; then cp zig-out/lib/libzig_id.so dist/bin/${{ matrix.platform }}/zig-id.node; fi
          if [ -f zig-out/lib/libzig_id.dylib ]; then cp zig-out/lib/libzig_id.dylib dist/bin/${{ matrix.platform }}/zig-id.node; fi
          if [ -f zig-out/bin/zig_id.dll ]; then cp zig-out/bin/zig_id.dll dist/bin/${{ matrix.platform }}/zig-id.node; fi
          ls -la dist/bin/${{ matrix.platform }}/
      - name: Upload prebuild
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.platform }}
          path: dist/bin/
          if-no-files-found: error

  publish:
    needs: [test, build-cross]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: https://registry.npmjs.org
      - name: Download prebuilds
        uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: dist/bin
          merge-multiple: true
      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
